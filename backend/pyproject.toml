[project]
name = "lumalab-backend"
version = "0.1.0"
description = "LumaLab photograph editing API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.4",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==13.0.0",
    "psycopg[binary,pool]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
prerelease = "disallow"

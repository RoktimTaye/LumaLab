name: Verify
on: [push, pull_request]
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --project backend
      - run: uv run --locked pytest
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm run contracts:check
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - name: Start isolated image API with a test preset catalogue
        run: |
          uv run --locked python -m scripts.e2e_server > /tmp/lumalab-e2e.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/v1/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/lumalab-e2e.log
          exit 1
        working-directory: backend
      - run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results
